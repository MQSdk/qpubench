name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools
        run: |
          pip install -e .
          # Pinned: unpinned linters change their default rule set between
          # releases, which turns CI red on pushes that changed nothing.
          # Bump these deliberately, with the fixes in the same commit.
          # types-requests: `requests` ships no inline types, so without the
          # stubs mypy fails on the lazy `import requests` in the HamLib,
          # QUBO and q-vSZP loaders. Stubs are a type-check-only dependency;
          # `requests` itself stays an optional extra.
          pip install pytest pytest-cov 'ruff==0.15.13' 'mypy==2.1.0' \
                      'types-requests==2.33.0.20260518'
      - name: Ruff lint
        run: ruff check
      - name: Mypy (strict)
        run: mypy src/qpubench
      - name: Tests (no quantum SDK required)
        run: pytest tests/ -q
      - name: Landing-page logo tiles and grid are in sync
        run: python docs/site/tools/make_logos.py --check
