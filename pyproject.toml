# ── Build backend ─────────────────────────────────────────────────────────────
# hatchling is PEP 517/518 compliant and works with pip, uv, and Poetry 2+.
# Conda-build calls `pip install .` which also uses this backend.
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# ── Core metadata (PEP 621) ───────────────────────────────────────────────────
[project]
name            = "qpubench"
version         = "0.1.0"
description     = "Modality-agnostic quantum benchmark framework"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.11"
authors         = [{ name = "MQS", email = "mark@mqs.dk" }]
keywords        = [
    "quantum computing", "benchmarking", "VQE", "MBQC",
    "qiskit", "pennylane", "CUDA-Q", "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Runtime dependency — only pydantic; all quantum backends are optional.
dependencies = ["pydantic>=2.0"]

[project.urls]
Homepage      = "https://github.com/mqsdk/qpubench"
Repository    = "https://github.com/mqsdk/qpubench"
"Bug Tracker" = "https://github.com/mqsdk/qpubench/issues"

# ── Optional extras ───────────────────────────────────────────────────────────
# Install with:
#   pip install "qpubench[qiskit]"
#   uv pip install "qpubench[qiskit]"
#   poetry add "qpubench[qiskit]"
[project.optional-dependencies]
qiskit  = ["qiskit>=2.0", "qiskit-aer", "qiskit-ibm-runtime", "qiskit-nature>=0.7", "qiskit_qasm3_import"]
qrack   = ["pyqrack"]
braket  = ["amazon-braket-sdk", "qiskit-braket-provider"]   # generic gate-based AWS Braket adapter (backends/braket_adapter.py)
iqm     = ["iqm-client[qiskit]"]   # IQM hardware adapter (backends/iqm_adapter.py) — standalone qiskit-iqm is obsolete, bundled here instead
classiq = ["classiq"]
mitiq   = ["mitiq", "ply"]   # Mitiq ZNE error-mitigation adapter (backends/unitaryfund_mitiq_adapter.py) — ply works around a real cirq-core QASM-import gap, see that module's docstring
pyscf   = ["pyscf"]   # mean-field/DFT, PCM/COSMO solvation, periodic pbc — schemas/pyscf_pyscf.py
hamlib  = ["h5py", "requests"]   # HamLib Chemistry loader (hamiltonian_sources/hamlib.py)
bse     = ["basis_set_exchange"]   # Basis Set Exchange basis-function-count loader (hamiltonian_sources/basis_set_exchange.py)
qvszp   = ["requests"]   # q-vSZP basis-set downloader/parser, no ORCA needed (hamiltonian_sources/qvszp.py)
pennylane = ["pennylane", "pennylane-qiskit", "aiohttp", "fsspec", "h5py"]   # PennyLane qchem dataset loader (hamiltonian_sources/pennylane_qchem.py) + lightning.qubit BackendAdapter (backends/pennylane_lightning_adapter.py, ships with pennylane; pennylane-qiskit loads the CircuitSpec's QASM)
openfermion = ["openfermion", "openfermionpyscf", "pyscf"]   # ab initio Hamiltonian construction (hamiltonian_sources/ab_initio.py)
tensor_network = ["quimb", "cotengra"]   # contraction path selection (tensor_network/contraction_path.py)
cantera = ["pyyaml"]   # ReactionMechanism.to_cantera_yaml() (schemas/reactions.py) — real cantera package only needed to load/run the exported mechanism, not to build it
storage = ["pyarrow", "pandas"]
s3      = ["boto3"]   # S3 / S3-compatible object stores (AWS S3, MinIO, HF Storage Buckets)
cudaq   = []   # CUDA-Q installed separately via conda/pip per NVIDIA docs
# integrations/generic_adapt_vqe/ classical optimizer — not a quantum SDK,
# used by ibm_qiskit_adapt_vqe/ and microsoft_qdk_adapt_vqe/ (numpy only
# needed to run their tests, which independently verify the Jordan-Wigner
# and circuit-synthesis math via dense-matrix construction).
adapt_vqe = ["scipy", "numpy"]
# integrations/kubeflow/ — compiles qpubench algorithmic steps into a
# Kubeflow Pipelines (kfp) DAG. Not a quantum SDK; only needed to compile
# and submit pipelines, not by the container images the pipeline runs.
kubeflow = ["kfp>=2.0", "kfp-kubernetes"]
all     = [
    "qiskit>=2.0", "qiskit-aer", "qiskit-ibm-runtime", "qiskit-nature>=0.7", "qiskit_qasm3_import",
    "amazon-braket-sdk", "qiskit-braket-provider",
    "iqm-client[qiskit]",
    "classiq",
    "mitiq", "ply",
    "pyscf",
    "h5py", "requests",
    "basis_set_exchange",
    "pennylane", "pennylane-qiskit", "aiohttp", "fsspec",
    "openfermion", "openfermionpyscf",
    "quimb", "cotengra",
    "pyyaml",
    "pyarrow", "pandas",
    "boto3",
    "scipy", "numpy",
    "kfp>=2.0", "kfp-kubernetes",
]

# ── Dependency groups (PEP 735) ───────────────────────────────────────────────
# Supported by: pip ≥24.1, uv, Poetry 2.
#
# pip:     pip install --group dev
# uv:      uv sync (auto-includes "dev" group)  /  uv sync --only-group dev
# poetry:  poetry install --with dev
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

# ── Hatchling ─────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/qpubench"]

# ── uv ────────────────────────────────────────────────────────────────────────
# uv installs from this pyproject.toml natively (PEP 517).
#
# Common commands:
#   uv sync                   install package + dev group
#   uv sync --all-extras      include all optional extras too
#   uv pip install .          bare pip-style install (no lockfile)
#   uv add qpubench           add as a dependency from another project
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Deliberate lazy-import pattern: pytest.importorskip / sys.path setup / SDK
# availability checks must run before the imports they guard.
"examples/qforte_vqe_benchmark.py"       = ["E402"]
"integrations/qforte/benchmark_example.py" = ["E402"]
"tests/test_generic_adapt_vqe.py"        = ["E402"]
"tests/test_schemas.py"                  = ["E402"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true

# Optional quantum/storage SDKs ship without type stubs; silence only their
# import errors so the strict gate stays meaningful for our own code.
[[tool.mypy.overrides]]
module = [
    "basis_set_exchange.*",
    "boto3.*",
    "botocore.*",
    "cotengra.*",
    "h5py.*",
    "mitiq.*",
    "openfermion.*",
    "openfermionpyscf.*",
    "opt_einsum.*",
    "pandas.*",
    "pennylane.*",
    "pyarrow.*",
    "pyscf.*",
    "qiskit.*",
    "qiskit_aer.*",
    "qiskit_braket_provider.*",
    "qiskit_ibm_runtime.*",
    "quimb.*",
    "yaml.*",
]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
