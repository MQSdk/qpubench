# ── Build backend ─────────────────────────────────────────────────────────────
# hatchling is PEP 517/518 compliant and works with pip, uv, and Poetry 2+.
# Conda-build calls `pip install .` which also uses this backend.
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# ── Core metadata (PEP 621) ───────────────────────────────────────────────────
[project]
name            = "qpubench"
version         = "0.1.0"
description     = "Modality-agnostic quantum benchmark framework"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.11"
authors         = [{ name = "MQS", email = "mark@mqs.dk" }]
keywords        = [
    "quantum computing", "benchmarking", "VQE", "MBQC",
    "qiskit", "pennylane", "CUDA-Q", "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Runtime dependency — only pydantic; all quantum backends are optional.
dependencies = ["pydantic>=2.0"]

[project.urls]
Homepage        = "https://qpubench.org"
Documentation   = "https://qpubench.org"
Repository      = "https://github.com/mqsdk/qpubench"
"Bug Tracker"   = "https://github.com/mqsdk/qpubench/issues"

# ── Optional extras ───────────────────────────────────────────────────────────
# Install with:
#   pip install "qpubench[qiskit]"
#   uv pip install "qpubench[qiskit]"
#   poetry add "qpubench[qiskit]"
[project.optional-dependencies]
qiskit  = ["qiskit>=2.0", "qiskit-aer", "qiskit-ibm-runtime>=0.47", "qiskit-nature>=0.7", "qiskit_qasm3_import"]   # >=0.47 ships the FakeAachen calibration snapshot the IBM campaign costs against offline
qrack   = ["pyqrack", "qiskit>=2.0", "qiskit_qasm3_import"]   # Qrack simulator adapter (backends/qrack_adapter.py) — PyQrack has no QASM parser, so qiskit loads the CircuitSpec and QrackCircuit.in_from_qiskit_circuit() lowers it
braket  = ["amazon-braket-sdk", "qiskit-braket-provider"]   # generic gate-based AWS Braket adapter (backends/braket_adapter.py)
iqm     = ["iqm-client[qiskit]"]   # IQM hardware adapter (backends/iqm_adapter.py) — standalone qiskit-iqm is obsolete, bundled here instead
quantinuum = ["pytket-quantinuum", "pytket-qiskit"]   # Quantinuum H-Series adapter (backends/quantinuum_adapter.py) — pytket-qiskit converts the CircuitSpec QASM to a pytket Circuit
qibo    = ["qibo", "qibo-cloud-backends"]   # Qibo simulator / Qibolab hardware / Qibo cloud adapter (backends/qibo_adapter.py) — QASM3 CircuitSpecs also need the [qiskit] extra for QASM2 conversion
classiq = ["classiq"]
mitiq   = ["mitiq", "ply"]   # Mitiq ZNE error-mitigation adapter (backends/unitaryfund_mitiq_adapter.py) — ply works around a real cirq-core QASM-import gap, see that module's docstring
pyscf   = ["pyscf"]   # mean-field/DFT, PCM/COSMO solvation, periodic pbc — schemas/pyscf_pyscf.py
cebule  = ["mqsdk @ git+https://gitlab.com/mqsdk/python-sdk.git"]   # Cebule (MQS) task submission — TN_QC_OPT, MOL_MAP, COSMO; needed only to RUN tasks (data/benchmarks/ibm_tn-vqe_qesem/run_campaign_batch.ipynb), not to use the schemas/mirrors/mqsdk_cebule.py mirror. Not on PyPI, hence the direct reference and the allow-direct-references below
hamlib  = ["h5py", "requests"]   # HamLib Chemistry loader (hamiltonian_sources/hamlib.py)
bse     = ["basis_set_exchange"]   # Basis Set Exchange basis-function-count loader (hamiltonian_sources/basis_set_exchange.py)
qubo    = ["requests"]   # QUBO Hamiltonian loaders (hamiltonian_sources/qubo.py) — OR-Library + MQLib downloads
qvszp   = ["requests"]   # q-vSZP basis-set downloader/parser, no ORCA needed (hamiltonian_sources/qvszp.py)
pennylane = ["pennylane", "pennylane-qiskit", "aiohttp", "fsspec", "h5py"]   # PennyLane qchem dataset loader (hamiltonian_sources/pennylane_qchem.py) + lightning.qubit BackendAdapter (backends/pennylane_lightning_adapter.py, ships with pennylane; pennylane-qiskit loads the CircuitSpec's QASM)
openfermion = ["openfermion", "openfermionpyscf", "pyscf"]   # ab initio Hamiltonian construction (hamiltonian_sources/ab_initio.py)
tensor_network = ["quimb", "cotengra"]   # contraction path selection (tensor_network/contraction_path.py)
cantera = ["pyyaml"]   # ReactionMechanism.to_cantera_yaml() (schemas/reactions.py) — real cantera package only needed to load/run the exported mechanism, not to build it
storage = ["pyarrow", "pandas"]
s3      = ["boto3"]   # S3 / S3-compatible object stores (AWS S3, MinIO, HF Storage Buckets)
cudaq   = []   # CUDA-Q installed separately via conda/pip per NVIDIA docs
# integrations/generic_adapt_vqe/ classical optimizer — not a quantum SDK,
# used by ibm_qiskit_adapt_vqe/ and microsoft_qdk_adapt_vqe/ (numpy only
# needed to run their tests, which independently verify the Jordan-Wigner
# and circuit-synthesis math via dense-matrix construction).
adapt_vqe = ["scipy", "numpy"]
# integrations/kubeflow/ — compiles qpubench algorithmic steps into a
# Kubeflow Pipelines (kfp) DAG. Not a quantum SDK; only needed to compile
# and submit pipelines, not by the container images the pipeline runs.
kubeflow = ["kfp>=2.0", "kfp-kubernetes"]
all     = [
    "qiskit>=2.0", "qiskit-aer", "qiskit-ibm-runtime>=0.47", "qiskit-nature>=0.7", "qiskit_qasm3_import",
    "pyqrack",
    "amazon-braket-sdk", "qiskit-braket-provider",
    "iqm-client[qiskit]",
    "pytket-quantinuum", "pytket-qiskit",
    "qibo", "qibo-cloud-backends",
    "classiq",
    "mitiq", "ply",
    "pyscf",
    "h5py", "requests",
    "basis_set_exchange",
    "requests",
    "pennylane", "pennylane-qiskit", "aiohttp", "fsspec",
    "openfermion", "openfermionpyscf",
    "quimb", "cotengra",
    "pyyaml",
    "pyarrow", "pandas",
    "boto3",
    "scipy", "numpy",
    "kfp>=2.0", "kfp-kubernetes",
]

# ── Dependency groups (PEP 735) ───────────────────────────────────────────────
# Supported by: pip ≥24.1, uv, Poetry 2.
#
# pip:     pip install --group dev
# uv:      uv sync (auto-includes "dev" group)  /  uv sync --only-group dev
# poetry:  poetry install --with dev
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",   # stubs for the lazy `import requests` in the HamLib/QUBO/q-vSZP loaders
]

# ── Hatchling ─────────────────────────────────────────────────────────────────
# mqsdk is distributed from GitLab rather than PyPI, so the [cebule] extra
# has to name it by URL, and hatchling rejects a direct reference unless
# this is set. PyPI rejects direct references on upload too, so publishing
# qpubench there would mean dropping that extra or vendoring the SDK.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/qpubench"]

# ── uv ────────────────────────────────────────────────────────────────────────
# uv installs from this pyproject.toml natively (PEP 517).
#
# Common commands:
#   uv sync                   install package + dev group
#   uv sync --all-extras      include all optional extras too
#   uv pip install .          bare pip-style install (no lockfile)
#   uv add qpubench           add as a dependency from another project
#
# Dev tools live in the PEP 735 [dependency-groups] table above, which uv reads
# natively — the older, uv-specific [tool.uv] dev-dependencies field is
# deprecated and deliberately not used here.

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
# Select rules explicitly rather than inheriting ruff's default set: the default
# set grows between ruff releases, which silently turns a green CI red on an
# unrelated push. CI pins the ruff version (see .github/workflows/ci.yml); this
# list is what that pin is expected to enforce.
#   E4/E7/E9, F  ruff's historical default (pycodestyle subset + pyflakes)
#   I            import sorting (isort)
#   EXE          shebang / executable-bit consistency
select = ["E4", "E7", "E9", "F", "I", "EXE"]

[tool.ruff.lint.per-file-ignores]
# Deliberate lazy-import pattern: pytest.importorskip / sys.path setup / SDK
# availability checks must run before the imports they guard.
"examples/qforte_vqe_benchmark.py"       = ["E402"]
"integrations/qforte/benchmark_example.py" = ["E402"]
"tests/test_generic_adapt_vqe.py"        = ["E402"]
"tests/test_schemas.py"                  = ["E402"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true

# Optional quantum/storage SDKs ship without type stubs; silence only their
# import errors so the strict gate stays meaningful for our own code.
[[tool.mypy.overrides]]
module = [
    "basis_set_exchange.*",
    "boto3.*",
    "botocore.*",
    "cotengra.*",
    "h5py.*",
    "iqm.*",
    "mitiq.*",
    "openfermion.*",
    "openfermionpyscf.*",
    "opt_einsum.*",
    "pandas.*",
    "pennylane.*",
    "pyarrow.*",
    "pyqrack.*",
    "pyscf.*",
    "pytket.*",
    "qibo.*",
    "qibo_cloud_backends.*",
    "qiskit.*",
    "qiskit_aer.*",
    "qiskit_braket_provider.*",
    "qiskit_ibm_runtime.*",
    "quimb.*",
    "yaml.*",
]
ignore_missing_imports = true

# openfermion and iqm-client *do* ship inline types, so whether their calls
# need a per-line `type: ignore` depends on whether the optional extra is
# installed: with the SDK present mypy follows it and flags the partially
# typed API (attributes not re-exported, untyped calls), while without it the
# override above makes the module `Any` and those same comments turn into
# "unused ignore" errors. CI installs no quantum SDKs, so keep the ignores —
# correct for developers who have `[openfermion]` / `[iqm]` — and stop warning
# about them being unused in the SDK-less environment. Only these two modules
# are affected; ignores elsewhere hold either way.
[[tool.mypy.overrides]]
module = [
    "qpubench.backends.iqm_adapter",
    "qpubench.hamiltonian_sources.ab_initio",
]
warn_unused_ignores = false

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# A gate whose purpose is to fail the build has to run in the build.
# Without this, `pytest` only imports qpubench where someone has already
# installed it editable -- so the doc-consistency gate passed locally and
# never ran in CI or in a fresh venv, which is exactly the population it
# exists for.
pythonpath = ["src", "."]
