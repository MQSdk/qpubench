# ── Build backend ─────────────────────────────────────────────────────────────
# hatchling is PEP 517/518 compliant and works with pip, uv, and Poetry 2+.
# Conda-build calls `pip install .` which also uses this backend.
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# ── Core metadata (PEP 621) ───────────────────────────────────────────────────
[project]
name            = "qpubench"
version         = "0.1.0"
description     = "Modality-agnostic quantum benchmark framework"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.11"
authors         = [{ name = "MQS", email = "mark@mqs.dk" }]
keywords        = [
    "quantum computing", "benchmarking", "VQE", "MBQC",
    "qiskit", "pennylane", "CUDA-Q", "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Runtime dependency — only pydantic; all quantum backends are optional.
dependencies = ["pydantic>=2.0"]

[project.urls]
Homepage      = "https://github.com/mqsdk/qpubench"
Repository    = "https://github.com/mqsdk/qpubench"
"Bug Tracker" = "https://github.com/mqsdk/qpubench/issues"

# ── Optional extras ───────────────────────────────────────────────────────────
# Install with:
#   pip install "qpubench[qiskit]"
#   uv pip install "qpubench[qiskit]"
#   poetry add "qpubench[qiskit]"
[project.optional-dependencies]
qiskit  = ["qiskit>=2.0", "qiskit-aer", "qiskit-ibm-runtime", "qiskit-nature>=0.7", "qiskit_qasm3_import"]
qrack   = ["pyqrack"]
braket  = ["amazon-braket-sdk", "qiskit-braket-provider"]   # generic gate-based AWS Braket adapter (backends/braket_adapter.py)
iqm     = ["iqm-client[qiskit]"]   # IQM hardware adapter (backends/iqm_adapter.py) — standalone qiskit-iqm is obsolete, bundled here instead
classiq = ["classiq"]
pyscf   = ["pyscf"]   # mean-field/DFT, PCM/COSMO solvation, periodic pbc — schemas/pyscf.py
hamlib  = ["h5py", "requests"]   # HamLib Chemistry loader (hamiltonian_sources/hamlib.py)
pennylane = ["pennylane", "aiohttp", "fsspec", "h5py"]   # PennyLane qchem dataset loader (hamiltonian_sources/pennylane_qchem.py)
openfermion = ["openfermion", "openfermionpyscf", "pyscf"]   # ab initio Hamiltonian construction (hamiltonian_sources/ab_initio.py)
tensor_network = ["quimb", "cotengra"]   # contraction path selection (tensor_network/contraction_path.py)
storage = ["pyarrow", "pandas"]
s3      = ["boto3"]   # S3 / S3-compatible object stores (AWS S3, MinIO, HF Storage Buckets)
cudaq   = []   # CUDA-Q installed separately via conda/pip per NVIDIA docs
# integrations/generic_adapt_vqe/ classical optimizer — not a quantum SDK,
# used by ibm_qiskit_adapt_vqe/ and microsoft_qdk_adapt_vqe/ (numpy only
# needed to run their tests, which independently verify the Jordan-Wigner
# and circuit-synthesis math via dense-matrix construction).
adapt_vqe = ["scipy", "numpy"]
# integrations/kubeflow/ — compiles qpubench algorithmic steps into a
# Kubeflow Pipelines (kfp) DAG. Not a quantum SDK; only needed to compile
# and submit pipelines, not by the container images the pipeline runs.
kubeflow = ["kfp>=2.0", "kfp-kubernetes"]
all     = [
    "qiskit>=2.0", "qiskit-aer", "qiskit-ibm-runtime", "qiskit-nature>=0.7", "qiskit_qasm3_import",
    "amazon-braket-sdk", "qiskit-braket-provider",
    "iqm-client[qiskit]",
    "classiq",
    "pyscf",
    "h5py", "requests",
    "pennylane", "aiohttp", "fsspec",
    "openfermion", "openfermionpyscf",
    "quimb", "cotengra",
    "pyarrow", "pandas",
    "boto3",
    "scipy", "numpy",
    "kfp>=2.0", "kfp-kubernetes",
]

# ── Dependency groups (PEP 735) ───────────────────────────────────────────────
# Supported by: pip ≥24.1, uv, Poetry 2.
#
# pip:     pip install --group dev
# uv:      uv sync (auto-includes "dev" group)  /  uv sync --only-group dev
# poetry:  poetry install --with dev
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

# ── Hatchling ─────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/qpubench"]

# ── uv ────────────────────────────────────────────────────────────────────────
# uv installs from this pyproject.toml natively (PEP 517).
#
# Common commands:
#   uv sync                   install package + dev group
#   uv sync --all-extras      include all optional extras too
#   uv pip install .          bare pip-style install (no lockfile)
#   uv add qpubench           add as a dependency from another project
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
